name: Daily Job Scraper

on:
  schedule:
    # GitHub starts scheduled runs 5-9 hours late (Oct 2026 runs set for 10:23 UTC started 15:00-20:00).
    # So it fires three times overnight (times in UTC; Travis is on UTC-6) and the scraper skips
    # any start within 12 hours of the last finished run. Whichever starts first does the work.
    - cron: '17 2 * * 1-5'
    - cron: '41 5 * * 1-5'
    - cron: '13 8 * * 1-5'
  workflow_dispatch:

# Overlapping starts queue instead of running side by side; the queued one then sees the fresh data and skips.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install beautifulsoup4 google-auth google-auth-oauthlib google-api-python-client

      - name: Run scraper
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_LIMIT: ${{ vars.APIFY_LIMIT }}
          SCORING_MODEL: ${{ vars.SCORING_MODEL }}
          ADZUNA_APP_ID:  ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_CLIENT_ID:     ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python scripts/scrape_jobs.py

      - name: Commit updated data
        run: |
          git config user.name "Job Bot"
          git config user.email "bot@job-tracker.local"
          git add data/
          git diff --staged --quiet || git commit -m "Update job data — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull origin main --rebase
          git push
